services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bizhealth}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-bizhealth}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  scrapers:
    build:
      context: ./scrapers
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Verifies the main loop in main.py is still running by checking that the
      # heartbeat file exists and was updated within the last 120 s.
      # main.py touches /tmp/scheduler_health every 60 s, so 120 s gives two
      # missed heartbeats before Docker marks the container unhealthy and restarts it.
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import time, os; f='/tmp/scheduler_health'; exit(0 if os.path.exists(f) and time.time()-os.path.getmtime(f)<120 else 1)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  demo:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ./demo:/usr/share/nginx/html:ro
    depends_on:
      - api

volumes:
  postgres_data:
